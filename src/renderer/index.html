<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AnySVG — Studio-Grade Vector Rasterizer</title>
  <meta name="description" content="Ultra-HD SVG to PNG rasterizer. Lossless 4K and 8K vector conversion powered by Electron, Node.js and Sharp.">

  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="/icon.png">
  <style>
    @keyframes splashIndeterminate {
      0% { transform: translateX(-100%); width: 30%; }
      50% { transform: translateX(50%); width: 60%; }
      100% { transform: translateX(250%); width: 30%; }
    }
  </style>
</head>
<body style="margin: 0; background-color: #09090b; overflow: hidden;">
  <div id="root">
    <div id="initial-splash" style="position:fixed;inset:0;background:#09090b;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;font-family:Inter,system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-app-region:drag;">
      <div style="position:absolute;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(168,85,247,0.12) 0%,transparent 70%);filter:blur(40px);pointer-events:none;"></div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;position:relative;z-index:1;">
        <div style="width:76px;height:76px;position:relative;display:flex;align-items:center;justify-content:center;">
          <img src="/icon.png" alt="AnySVG" style="width:100%;height:100%;object-fit:contain;border-radius:18px;box-shadow:0 12px 30px rgba(0,0,0,0.6),0 0 20px rgba(168,85,247,0.25);" />
        </div>
        <div>
          <div style="display:flex;align-items:center;gap:8px;justify-content:center;">
            <h1 style="font-size:26px;font-weight:700;color:#ffffff;letter-spacing:-0.5px;margin:0;">AnySVG</h1>
            <span style="font-size:10px;font-weight:600;padding:2px 7px;border-radius:9999px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);color:#e4e4e7;font-family:monospace;">Studio v1.0</span>
          </div>
          <p style="font-size:12px;color:#a1a1aa;margin:6px 0 0 0;">Studio-Grade Vector Rasterization & Optimization</p>
        </div>
        <div style="width:200px;height:4px;border-radius:9999px;background:rgba(255,255,255,0.08);overflow:hidden;margin-top:6px;">
          <div style="height:100%;width:45%;background:linear-gradient(90deg,#a855f7,#38bdf8);border-radius:9999px;animation:splashIndeterminate 1.2s infinite ease-in-out;"></div>
        </div>
        <span style="font-size:11px;color:#71717a;font-family:monospace;letter-spacing:0.2px;">Initializing studio engine...</span>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
